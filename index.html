:root{color-scheme:dark;--bg:#030806;--ink:#f4ead9;--gold-2:#f0ce76;--serif:Georgia,"Times New Roman",serif;--sans:Inter,Segoe UI,Roboto,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{min-height:100%;background:#030806}
body{min-height:100%;margin:0;background:#030806;color:#f4ead9;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.shell{position:relative;z-index:1;width:100%;max-width:1920px;margin:0 auto;padding:0 0 42px}
.site-header{position:sticky;top:0;z-index:50;display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;grid-template-areas:"brand nav actions";align-items:center;gap:clamp(10px,1.2vw,20px);min-height:48px;padding:3px clamp(18px,1.65vw,30px);border-bottom:1px solid rgba(201,151,67,.36);background:linear-gradient(180deg,rgba(2,8,7,.96),rgba(3,12,10,.9));box-shadow:0 14px 34px rgba(0,0,0,.2)}
.brand-lockup{grid-area:brand;display:inline-flex;align-items:center;gap:10px;color:inherit}
.brand-copy{display:grid;gap:4px;min-width:0}
.brand-name{display:block;white-space:nowrap;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.18rem,1.3vw,1.42rem);line-height:1.02;color:#f4ead9}
.brand-sub,.brand-sub[hidden]{display:none!important}
.brand-mark{display:block;flex:0 0 auto;width:26px;height:26px;background:#f0ce76}
.site-nav{grid-area:nav;display:flex;justify-content:center;align-items:center;gap:11px;flex-wrap:nowrap;min-width:0}
.site-nav>a{display:inline-flex;align-items:center;min-height:25px;padding:0;color:rgba(244,234,217,.72);font-size:.84rem;white-space:nowrap}
.header-actions{grid-area:actions;position:relative;z-index:2;display:flex;justify-content:flex-end;align-items:center;gap:6px;min-width:180px;min-height:30px}
body.auth-pending .header-actions>*{visibility:hidden}
.menu-button{display:none}
#app{display:block}
.hero-frame,.hero-image{aspect-ratio:1/1}
.hero-image{display:block;width:100%;height:100%;object-fit:cover}
@media(max-width:860px){.shell{width:100%;padding:0 0 36px}.site-header{grid-template-columns:minmax(0,1fr) auto 28px;grid-template-areas:"brand actions menu" "nav nav nav";column-gap:3px;row-gap:0;min-height:36px;padding:3px 11px 4px;background:linear-gradient(180deg,rgba(2,8,7,.96),rgba(3,12,10,.9))}.brand-lockup{gap:7px}.brand-mark{width:27px;height:27px}.brand-name{max-width:calc(100vw - 134px);overflow:hidden;text-overflow:ellipsis;font-size:.96rem;line-height:1}.site-nav{display:none}.header-actions{gap:3px;min-width:0;min-height:28px}.header-actions #loginButton,.header-actions #adminButton,.header-actions #adminTrafficControl{display:none!important}.menu-button{grid-area:menu;width:28px;height:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;border:0;background:transparent}.menu-button span{display:block;width:13px;height:2px;margin:0 auto;border-radius:99px;background:#f0ce76}}
  </style>
