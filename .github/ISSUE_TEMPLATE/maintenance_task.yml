name: Maintenance task
description: Track tests, CI, release, security, or repository upkeep.
title: "[Maintenance]: "
labels: ["maintenance"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - tests
        - CI
        - release
        - security
        - privacy
        - repository upkeep
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the maintenance work.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What evidence will show this is complete?
    validations:
      required: true
